<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>
    <script>
      // 只要不是首頁，全部導回 index.html，並保留原本的路徑
      var pathname = location.pathname;
      var search = location.search || '';
      var hash = location.hash || '';
      var redirectUrl = '/index.html?redirect=' + encodeURIComponent(pathname + search + hash);
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <h1>404 Not Found</h1>
    <p>頁面不存在，正在為你重新導向...</p>
  </body>
</html>
